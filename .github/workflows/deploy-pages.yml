name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_call runs right after the forecast job pushed new data;
          # make sure we deploy that commit, not the one that triggered the run
          ref: main

      - name: Assemble static site
        run: |
          mkdir -p _site/data/history
          cp site/* _site/
          cp data/latest.json _site/data/
          cp data/history/*.json _site/data/history/ 2>/dev/null || true
          python -c "
          import json, os
          weeks = sorted(f[:-5] for f in os.listdir('data/history') if f.endswith('.json'))
          json.dump(weeks, open('_site/data/index.json', 'w'))
          "

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
