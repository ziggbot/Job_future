name: Weekly AI Forecast

on:
  schedule:
    # Every Monday 06:00 UTC — new numbers land before the work week starts
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weekly-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openai

      - name: Generate this week's forecast
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Optional: override the default model (gpt-5.4)
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python scripts/generate_forecast.py

      - name: Commit and push new data
        run: |
          git config user.name "ai-forecast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new forecast data to commit."
          else
            WEEK=$(python -c "import json;print(json.load(open('data/latest.json'))['week'])")
            git commit -m "Forecast update: ${WEEK}"
            # actions/checkout leaves a detached HEAD — push it back explicitly
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  deploy:
    needs: forecast
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
